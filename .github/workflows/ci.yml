name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # TypeScript side: the docs site and repo tooling. Everything else in this repo is Swift.
  web:
    name: Biome, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome
        run: bun run check

      - name: Type-check
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build docs
        run: bun run build

  # Swift side: the shared package only. The Xcode app target is deliberately not built
  # on every push — it is slow, and DenTimeCore is where the logic worth testing lives.
  core:
    name: DenTimeCore build & test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build --package-path packages/DenTimeCore

      - name: Test
        run: swift test --package-path packages/DenTimeCore

  # Cheap guards for the rules in CLAUDE.md that are easy to break by accident.
  guards:
    name: Scope guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: No EventKit and no StoreKit
        run: |
          if grep -rn --include='*.swift' -E '^\s*import (EventKit|StoreKit)' .; then
            echo "::error::Calendar integration and in-app purchases are out of scope."
            exit 1
          fi

      # Matches dependencies and config files rather than prose, so the planning docs and
      # the code comments that explain *why* these are gone do not trip it.
      - name: No resurrected backend dependencies
        run: |
          if grep -rn --include='package.json' --exclude-dir=node_modules \
             -E '"(hono|drizzle-orm|drizzle-kit|better-auth|wrangler|miniflare|@cloudflare/[^"]+)"\s*:' .; then
            echo "::error::CloudKit is the backend. See docs/planning/DECISIONS.md, decision 1."
            exit 1
          fi

      - name: No backend config files and no apps/server
        run: |
          found=$(ls -d wrangler.toml wrangler.json wrangler.jsonc drizzle.config.ts apps/server 2>/dev/null || true)
          if [ -n "$found" ]; then
            echo "::error::Found $found — there is no server in DenTime."
            exit 1
          fi
